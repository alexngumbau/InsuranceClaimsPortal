spring.application.name=InsuranceClaimsBE
server.port=${SERVER_PORT:8080}

# All runtime configuration is supplied via environment variables, so the same
# artifact runs locally and in Docker with no rebuild. Locally, DB_URL points at
# your MySQL (see .env.example); docker-compose.yml injects jdbc:mysql://mysql:3306/<db>.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Liquibase owns the database schema and applies it on startup.
# Hibernate only validates that the JPA entities match the migrated schema.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
